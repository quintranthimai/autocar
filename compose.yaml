version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autocar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autocar_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - autocar_pgdata:/var/lib/postgresql/data

volumes:
  autocar_pgdata:
    driver: local  